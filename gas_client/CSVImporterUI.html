<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
      body { padding: 15px; font-family: 'Google Sans', Arial, sans-serif; }
      .container { display: flex; flex-direction: column; gap: 15px; }
      .loading { display: none; margin-top: 10px; color: #1a73e8; font-style: italic; }
      .error { color: #d93025; font-weight: bold; margin-top: 5px; }
      .success { color: #137333; font-weight: bold; margin-top: 5px; }
      input[type="file"] {
        padding: 12px;
        border: 2px dashed #dadce0;
        border-radius: 8px;
        width: 100%;
        box-sizing: border-box;
        cursor: pointer;
      }
      input[type="file"]:hover { border-color: #1a73e8; }
      .info { font-size: 12px; color: #5f6368; margin-top: -5px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <label for="csvFile"><b>SolidWorks BOM CSV Dosyası Seçin:</b></label>
        <p class="info">VBA Makrosu ile oluşturulan _BOM.csv dosyası (Noktalı virgül ayraçlı)</p>
      </div>

      <input type="file" id="csvFile" accept=".csv">

      <div id="status"></div>

      <div>
        <button class="action" onclick="uploadFile()">📂 Yükle</button>
        <button onclick="google.script.host.close()">İptal</button>
      </div>

      <div id="loading" class="loading">
        ⏳ Dosya yükleniyor ve sayfaya yazılıyor, lütfen bekleyin...
      </div>
    </div>

    <script>
      function uploadFile() {
        var fileInput = document.getElementById('csvFile');
        var statusDiv = document.getElementById('status');
        var loadingDiv = document.getElementById('loading');

        if (fileInput.files.length === 0) {
          statusDiv.className = 'error';
          statusDiv.textContent = "Lütfen bir dosya seçin!";
          return;
        }

        var file = fileInput.files[0];
        statusDiv.textContent = "";
        loadingDiv.style.display = "block";

        var reader = new FileReader();
        reader.onload = function(e) {
          var contents = e.target.result;
          google.script.run
            .withSuccessHandler(function() {
              loadingDiv.style.display = "none";
              statusDiv.className = 'success';
              statusDiv.textContent = "✅ Başarıyla yüklendi!";
              setTimeout(function() { google.script.host.close(); }, 1000);
            })
            .withFailureHandler(function(error) {
              loadingDiv.style.display = "none";
              statusDiv.className = 'error';
              statusDiv.textContent = "❌ Hata: " + error.message;
            })
            .processCSVImport(contents);
        };

        reader.readAsText(file, "UTF-8");
      }
    </script>
  </body>
</html>
